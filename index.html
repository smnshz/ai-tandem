<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable verhindern das versehentliche Reinzoomen
         beim Antippen von Text/Eingabefeldern auf iOS. Pinch-to-Zoom bleibt in
         Safari trotzdem erhalten, weil iOS user-scalable=no bewusst ignoriert. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="AI Sprachtandem – Sprachen lernen im Gespräch, mit Tap-Übersetzung für einzelne Zeichen." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>AI Sprachtandem</title>
  </head>
